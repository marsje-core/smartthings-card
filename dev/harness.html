<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
html{--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--card-background-color:#1c1c1c;--divider-color:rgba(225,225,225,.12);--primary-color:#9c27b0}
body{background:#111;font-family:Roboto,sans-serif;padding:16px;display:grid;grid-template-columns:repeat(2,300px);gap:12px}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;border:1px solid var(--divider-color);height:64px}
</style>
<script>
customElements.define("ha-card", class extends HTMLElement{});
const MAP={"mdi:washing-machine":"W","mdi:tumble-dryer":"D","mdi:play":"▶","mdi:pause":"⏸","mdi:stop":"■","mdi:close":"✕","mdi:cog-outline":"⚙","mdi:chevron-down":"⌄","mdi:minus":"−","mdi:plus":"+","mdi:check":"✓"};
customElements.define("ha-icon", class extends HTMLElement{connectedCallback(){this.style.cssText+="width:24px;height:24px;display:inline-grid;place-items:center;font-size:14px";this.textContent=MAP[this.getAttribute("icon")]||"●"}});
</script>
<script type="module" src="../smartthings-laundry-card.js"></script>
</head><body>
<div id="w"></div><div id="d"></div><div id="w2"></div><div id="o"></div>
<script type="module">
const now=Date.now();
function st(id,state,attrs={}){return {entity_id:id,state,attributes:attrs}}
const S={}, E={};
function add(dev,id,tk,state,attrs={},platform="smartthings"){S[id]=st(id,state,attrs);E[id]={entity_id:id,device_id:dev,platform,translation_key:tk}}
add("W","sensor.w_ms","washer_machine_state","run");add("W","sensor.w_js","washer_job_state","rinse");
add("W","sensor.w_ct","completion_time",new Date(now+83*60000).toISOString());
add("W","select.w_op","operating_state","run",{options:["run","pause","stop"]});
add("W","select.w_cy","washer_cycle","cotton",{options:["cotton","eco_40_60","super_speed","quick_wash","intense_cold","hygiene_steam","colors","wool","outdoor","bedding","synthetics","delicates","rinse_spin","drain_spin","jeans","silent_wash","baby_care","sportswear","cloudy_day","shirts","towels","mixed_load","drum_clean"]});
add("W","select.w_t","water_temperature","40",{options:["cold","20","30","40","60","90"]});
add("W","select.w_s","spin_level","1200",{options:["no_spin","400","800","1000","1200","1400"]});
add("W","number.w_r","washer_rinse_cycles","2",{min:0,max:5,step:1});
add("W","number.w_de","delay_end","0",{min:0,max:1440,step:1});
add("W","switch.w_b","bubble_soak","off");
add("W","select.w_da","detergent_amount","standard",{options:["none","less","standard","extra"]});
add("W","binary_sensor.w_rc","remote_control","on");add("W","sensor.w_dl","detergent_level","less");add("W","sensor.w_sl","softener_level","normal");
add("D","sensor.d_ms","dryer_machine_state","stop");add("D","sensor.d_js","dryer_job_state","none");
add("D","select.d_op","operating_state","stop",{options:["run","pause","stop"]});
add("D","select.d_cy","dryer_cycle","cotton",{options:["cotton","synthetics","mixed_load","towels","bedding","time_dry"]});
add("D","select.d_dl","dry_level","normal",{options:["damp","less","normal","more"]});
add("D","select.d_dt","drying_time","0",{options:["0"]});
add("D","number.d_de","delay_end","120",{min:0,max:1440,step:1});
add("D","switch.d_wp","wrinkle_prevent","on");add("D","switch.d_acl","auto_cycle_link","off");
add("D","binary_sensor.d_rc","remote_control","off");
add("L","sensor.l_ms","machine_state","active",{},"localthings");
add("L","binary_sensor.l_active","cycle_active","on",{},"localthings");
add("L","sensor.l_progress","progress","drumcleaning",{},"localthings");
add("L","sensor.l_finish","finish_time",new Date(now+116*60000).toISOString(),{},"localthings");
add("L","sensor.l_remaining","completion_minutes","116",{},"localthings");
add("L","button.l_start","start","unknown",{},"localthings");
add("L","button.l_pause","pause","unknown",{},"localthings");
add("L","button.l_stop","stop","unknown",{},"localthings");
add("L","select.l_cycle","washer_cycle_table_02","1C",{options:["1C","1D"]},"localthings");
add("L","select.l_temp","wash_temperature","60",{options:["Cold","20","30","40","60","90"]},"localthings");
add("L","select.l_spin","spin_speed","1200",{options:["NoSpin","400","800","1000","1200","1400"]},"localthings");
add("L","select.l_rinse","rinse_cycles","2",{options:["0","1","2","3","4","5"]},"localthings");
add("L","number.l_delay","delay_start_hours","0",{min:0,max:24,step:1,unit_of_measurement:"h"},"localthings");
add("L","switch.l_bubble","bubble_soak","off",{},"localthings");
add("L","switch.l_pre_wash","pre_wash","off",{},"localthings");
add("L","switch.l_intensive","intensive","off",{},"localthings");
add("L","select.l_detergent","detergent_quantity","01",{options:["00","01","02","03"]},"localthings");
add("L","select.l_hardness","detergent_water_hardness","01",{options:["01","02","03"]},"localthings");
add("L","select.l_softener","softener_quantity","01",{options:["00","01","02","03"]},"localthings");
add("L","select.l_concentration","softener_concentration","01",{options:["01","02","03"]},"localthings");
add("L","switch.l_auto_detergent","auto_detergent","on",{},"localthings");
add("L","switch.l_auto_softener","auto_softener","off",{},"localthings");
add("L","binary_sensor.l_remote","remote_control","on",{},"localthings");
add("O","sensor.o_ms","machine_state","idle",{},"localthings");
add("O","sensor.o_state","oven_state","ready",{},"localthings");
add("O","binary_sensor.o_active","cycle_active","off",{},"localthings");
add("O","binary_sensor.o_door","door_open","off",{},"localthings");
add("O","select.o_mode","cooking_mode","Convection",{options:["NoOperation","Convection","FanConventional","AirFryer","MicroWave","SteamClean"]},"localthings");
add("O","number.o_temp","setpoint","160",{min:40,max:230,step:5,unit_of_measurement:"°C"},"localthings");
add("O","number.o_time","cook_time","60",{min:1,max:600,step:1,unit_of_measurement:"min"},"localthings");
add("O","sensor.o_current","current_temp_c","25",{unit_of_measurement:"°C"},"localthings");
add("O","sensor.o_remaining","cook_time_remaining","3600",{unit_of_measurement:"s"},"localthings");
add("O","button.o_start","start_cooking","unknown",{},"localthings");
add("O","button.o_pause","pause","unknown",{},"localthings");
add("O","button.o_stop","stop","unknown",{},"localthings");
add("O","switch.o_lamp","lamp","off",{},"localthings");
add("O","switch.o_sound","sound","on",{},"localthings");
add("O","binary_sensor.o_remote","remote_control","on",{},"localthings");
const hass={states:S,entities:E,devices:{W:{name:"Washer"},D:{name:"Dryer"},L:{name:"WW11DB8B95GBU3"},O:{name:"Samsung oven"}},language:"en",locale:{language:"en"},
 formatEntityState:(s,v)=>(v??s.state).replace(/_/g," "),
 callService:async(d,sv,data)=>{console.log("CALL",d,sv,JSON.stringify(data)); if(data.entity_id==="select.d_op") throw new Error("Can only be updated when remote control is enabled");
   const s=S[data.entity_id]; if(sv==="select_option") s.state=data.option; if(sv==="set_value") s.state=String(data.value); if(sv==="toggle") s.state=s.state==="on"?"off":"on";
   if(data.entity_id==="select.w_op") S["sensor.w_ms"].state=data.option;
   if(sv==="press" && data.entity_id==="button.l_pause"){S["sensor.l_ms"].state="pause";S["binary_sensor.l_active"].state="off";}
   if(sv==="press" && data.entity_id==="button.l_start"){S["sensor.l_ms"].state="active";S["binary_sensor.l_active"].state="on";}
   if(sv==="press" && data.entity_id==="button.l_stop"){S["sensor.l_ms"].state="idle";S["binary_sensor.l_active"].state="off";}
   if(sv==="press" && data.entity_id==="button.o_start"){S["sensor.o_ms"].state="active";S["sensor.o_state"].state="cooking";S["binary_sensor.o_active"].state="on";}
   if(sv==="press" && data.entity_id==="button.o_pause"){S["sensor.o_ms"].state="pause";S["binary_sensor.o_active"].state="off";}
   if(sv==="press" && data.entity_id==="button.o_stop"){S["sensor.o_ms"].state="idle";S["sensor.o_state"].state="ready";S["binary_sensor.o_active"].state="off";}
   const h={...hass,states:{...S}}; window.cards.forEach(c=>c.hass=h);}};
await customElements.whenDefined("smartthings-laundry-card");
window.cards=[];
for (const [el,dev] of [["w","W"],["d","D"],["w2","L"],["o","O"]]) {const c=document.createElement("smartthings-laundry-card");c.setConfig({device_id:dev});c.hass=hass;document.getElementById(el).appendChild(c);cards.push(c);}
</script></body></html>
